backend:
  name: github
  repo: meettheminmusic/meettheminmusic-blog
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Blog posts"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Unlisted", name: "unlisted", widget: "boolean", default: false }
      - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Featured image", name: "image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "songs"
    label: "Song library"
    folder: "content/songs"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Unlisted", name: "unlisted", widget: "boolean", default: false }
      - { label: "Featured on homepage", name: "featured", widget: "boolean", default: false, required: false }
      - { label: "Homepage card image", name: "card_image", widget: "image", required: false }
      - { label: "Musical concepts", name: "musical_concepts", widget: "list", required: false }
      - { label: "Social concepts", name: "social_concepts", widget: "list", required: false }
      - { label: "Movement concepts", name: "movement_concepts", widget: "list", required: false }
      - { label: "Supports/Adaptations", name: "supports_adaptations", widget: "list", required: false }
      - { label: "Keys", name: "keys", widget: "list", required: false }
      - { label: "Modes", name: "modes", widget: "list", required: false }
      - { label: "Meters", name: "meters", widget: "list", required: false }
      - { label: "Source", name: "source", widget: "string", required: false }
      - { label: "Source URL", name: "source_url", widget: "string", required: false }
      - label: "ABC Notation (single score)"
        name: "abc_notation"
        widget: "text"
        required: false
        hint: "Paste ABC notation here when the song has one score. Use 'Multiple scores' below for tabbed layouts."
      - label: "Sanitized ABC (Braille source)"
        name: sanitized_abc
        widget: text
        required: false
        hint: >
          A clean copy of the ABC notation for Music Braille translation.
          Remove before saving: %% directive lines · w:/W: lyric lines ·
          all header fields except K: M: L: · inline "quoted" chord labels ·
          !style! and +decoration+ markers.
          Keep: K: (with clef=perc if present), M:, L:, and all note/rest/barline content.
      - label: "Notation fallback image"
        name: "abc_image"
        widget: "image"
        required: false
        hint: "Shown if the interactive player fails to load (JS error, offline, etc.). Only used with 'ABC Notation' above."
      - label: "Default tempo (BPM)"
        name: "abc_tempo"
        widget: "number"
        default: 120
        required: false
        value_type: "int"
      - label: "Multiple scores"
        name: "abc_scores"
        widget: "list"
        required: false
        hint: "Add two or more scores to show a tabbed player (e.g. Full score / Rhythm only)."
        fields:
          - { label: "Tab label", name: "label", widget: "string", hint: "e.g. Full score" }
          - label: "Notation (ABC)"
            name: "notation"
            widget: "text"
          - label: "Fallback image"
            name: "image"
            widget: "image"
            required: false
            hint: "Shown if the interactive player fails to load."
          - label: "Tempo (BPM)"
            name: "tempo"
            widget: "number"
            required: false
            value_type: "int"
            hint: "Leave blank to use the default tempo above."
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "books"
    label: "Books"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    media_folder: "/static/images/books"
    public_folder: "/images/books"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Amazon affiliate URL", name: "amazon_url", widget: "string", required: false }
      - { label: "Cover image", name: "cover_image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }

  - name: "navigation"
    label: "Navigation"
    files:
      - name: "main_menu"
        label: "Header navigation"
        file: "data/navigation.yaml"
        fields:
          - name: items
            label: "Menu items"
            widget: list
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - { label: "Order", name: "weight", widget: "number", default: 10 }

  - name: "pages"
    label: "Pages"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Unlisted", name: "unlisted", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }