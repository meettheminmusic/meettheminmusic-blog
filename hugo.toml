baseURL = "https://meettheminmusic.com/"
languageCode = "en-us"
title = "Meet Them in Music"


[params]
  tagline = "Music education that starts where they are."
  seo_tagline = "Inclusive Elementary Music Education Resources"
  author = "Dr. P. Eric Bottorff"
  description = "Research-informed strategies, adaptable songs, and practical classroom tools for general music teachers who want every learner to belong in the music room."
  social_image = "/mtim-social-banner.svg"
  social_image_alt = "Meet Them in Music logo and tagline"
  # Brand colors (available in templates via .Site.Params)
  colorCharcoal = "#2C2C2A"
  colorWarmGray = "#5F5E5A"
  colorTeal = "#0F6E56"
  colorWarmWhite = "#FAFAF8"
  colorTealTint = "#E1F5EE"
  colorDarkTeal = "#085041"

[markup]
  [markup.highlight]
    style = "github"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allows raw HTML in Markdown if needed

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[taxonomies]
  tag = "tags"
  category = "categories"
  tonal_concept = "tonal_concepts"
  rhythmic_concept = "rhythmic_concepts"
  activity_type = "activity_types"
  social_concept = "social_concepts"
  movement_concept = "movement_concepts"
  support_adaptation = "supports_adaptations"
  language_origin = "language_origins"
  mode = "modes"
  meter = "meters"
  key = "keys"

[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tonal_concepts"
    weight = 90
  [[related.indices]]
    name = "rhythmic_concepts"
    weight = 90
  [[related.indices]]
    name = "activity_types"
    weight = 70
  [[related.indices]]
    name = "movement_concepts"
    weight = 60
  [[related.indices]]
    name = "social_concepts"
    weight = 50
  [[related.indices]]
    name = "meters"
    weight = 40
  [[related.indices]]
    name = "modes"
    weight = 40
  [[related.indices]]
    name = "tags"
    weight = 30
  [[related.indices]]
    name = "categories"
    weight = 30

[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 2
  [[menu.main]]
    name = "Song library"
    url = "/songs/"
    weight = 3
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 4
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 5

[permalinks]
  posts = "/:slug/"
