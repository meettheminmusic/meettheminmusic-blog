<section class="home-signup" id="signup" aria-labelledby="signup-heading">
  <div class="container-wide">
    <h2 id="signup-heading">Get practical inclusive music strategies.</h2>
    <p>
      Occasional research-informed ideas, adaptable song resources, and
      classroom tools for music teachers. No noise, only when there's
      something useful to share.
    </p>

    <form class="signup-form"
          action="https://buttondown.com/api/emails/embed-subscribe/meettheminmusic"
          method="post"
          aria-label="Email signup">
      <label for="signup-email" class="sr-only">Your email address</label>
      <input
        id="signup-email"
        type="email"
        name="email"
        placeholder="Your email address"
        required
        autocomplete="email"
        aria-required="true"
      >
      <button type="submit">Subscribe</button>
    </form>

  </div>
</section>
