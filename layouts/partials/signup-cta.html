<section class="home-signup" aria-labelledby="signup-heading">
  <div class="container-wide">
    <h2 id="signup-heading">New posts, when they're ready.</h2>
    <p>
      No noise. Research-informed strategies for your music room,
      delivered when there's something worth saying.
    </p>

    <form class="signup-form"
          action="https://buttondown.com/api/emails/embed-subscribe/meettheminmusic"
          method="post"
          aria-label="Email signup">
      <label for="signup-email" class="sr-only">Your email address</label>
      <input
        id="signup-email"
        type="email"
        name="email"
        placeholder="Your email address"
        required
        autocomplete="email"
        aria-required="true"
      >
      <button type="submit">Notify me</button>
    </form>

  </div>
</section>
