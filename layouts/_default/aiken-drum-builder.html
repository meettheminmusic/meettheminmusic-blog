<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
<style>
.ad-tool {
  --ad-card: #ffffff;
  --ad-border: #e2ddd5;
  --ad-text: #2C2C2A;
  --ad-muted: #5F5E5A;
  --ad-accent: #0F6E56;
  --ad-accent-dark: #085041;
  --ad-tint: #E1F5EE;
  --ad-radius: 12px;
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.25rem 20px 0;
  color: var(--ad-text);
}

.ad-tool h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 1rem; }

.ad-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
.ad-btn {
  padding: 8px 16px;
  border: 1px solid var(--ad-border);
  border-radius: 6px;
  background: var(--ad-card);
  color: var(--ad-text);
  font: 500 0.875rem/1.2 inherit;
  font-family: inherit;
  cursor: pointer;
}
.ad-btn:hover { border-color: var(--ad-accent); color: var(--ad-accent); background: var(--ad-tint); }
.ad-btn-primary { background: var(--ad-accent); border-color: var(--ad-accent); color: #fff; }
.ad-btn-primary:hover { background: var(--ad-accent-dark); border-color: var(--ad-accent-dark); color: #fff; }

.ad-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) minmax(320px, 1fr);
  gap: 24px;
  align-items: start;
}

/* The stage stays pinned and sized to the viewport so the whole character
   is always visible when projected, no matter how far the controls scroll. */
.ad-stage {
  position: sticky;
  top: 1rem;
  height: calc(100dvh - 2rem);
  max-height: 900px;
  background: var(--ad-card);
  border: 1px solid var(--ad-border);
  border-radius: var(--ad-radius);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}
.ad-stage:fullscreen { max-height: none; height: 100%; border: 0; border-radius: 0; cursor: pointer; }
.ad-stage:-webkit-full-screen { max-height: none; height: 100%; border: 0; border-radius: 0; cursor: pointer; }

/* Fixed-size drawing box (character bounds plus overhang), scaled by JS to fit the stage */
.ad-fit { position: relative; width: 480px; height: 560px; flex: none; transform-origin: center; }
.ad-character { position: absolute; left: 40px; top: 45px; width: 400px; height: 500px; }

.ad-part { position: absolute; display: flex; justify-content: center; align-items: center; font-size: 0; transition: all 0.3s ease; }
.ad-part span { display: block; line-height: 1; }

#ad-body { top: 150px; left: 100px; width: 200px; height: 200px; z-index: 10; }
#ad-body span { font-size: 200px; }
#ad-head { top: 0; left: 125px; width: 150px; height: 150px; z-index: 20; }
#ad-head span { font-size: 150px; }
#ad-hair { top: -30px; left: 125px; width: 150px; height: 60px; z-index: 25; }
#ad-hair span { font-size: 120px; }
#ad-eyes { top: 50px; left: 125px; width: 150px; height: 40px; z-index: 26; justify-content: space-evenly; }
#ad-eyes span { font-size: 45px; }
#ad-nose { top: 85px; left: 175px; width: 50px; height: 40px; z-index: 26; }
#ad-nose span { font-size: 45px; }
#ad-mouth { top: 120px; left: 150px; width: 100px; height: 40px; z-index: 26; }
#ad-mouth span { font-size: 45px; }
#ad-arm-left { top: 180px; left: 0; width: 100px; height: 100px; z-index: 5; transform: rotate(45deg); }
#ad-arm-right { top: 180px; right: 0; width: 100px; height: 100px; z-index: 5; transform: rotate(-45deg); }
#ad-arm-left span, #ad-arm-right span { font-size: 100px; }
#ad-hand-left { top: 240px; left: -30px; width: 60px; height: 60px; z-index: 6; }
#ad-hand-right { top: 240px; right: -30px; width: 60px; height: 60px; z-index: 6; }
#ad-hand-left span, #ad-hand-right span { font-size: 60px; }
#ad-leg-left { top: 340px; left: 110px; width: 80px; height: 120px; z-index: 5; }
#ad-leg-right { top: 340px; right: 110px; width: 80px; height: 120px; z-index: 5; }
#ad-leg-left span, #ad-leg-right span { font-size: 100px; }
#ad-foot-left { top: 450px; left: 100px; width: 80px; height: 50px; z-index: 6; }
#ad-foot-right { top: 450px; right: 100px; width: 80px; height: 50px; z-index: 6; }
#ad-foot-left span, #ad-foot-right span { font-size: 70px; }

.ad-controls {
  background: var(--ad-card);
  border: 1px solid var(--ad-border);
  border-radius: var(--ad-radius);
  padding: 20px 24px;
}
.ad-group { padding: 14px 0; border-bottom: 1px solid var(--ad-border); }
.ad-group:last-child { border-bottom: none; }
.ad-group-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.ad-group-head h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
.ad-custom { display: flex; gap: 6px; }
.ad-custom input { width: 64px; padding: 5px 8px; border: 1px solid var(--ad-muted); border-radius: 6px; font-size: 1rem; font-family: inherit; }
.ad-custom .ad-btn { padding: 5px 10px; }

.ad-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 8px; }
.ad-emoji {
  height: 56px;
  font-size: 30px;
  background: #FAFAF8;
  border: 2px solid var(--ad-border);
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.ad-emoji:hover { transform: scale(1.08); border-color: var(--ad-accent); }
.ad-emoji[aria-pressed="true"] { border-color: var(--ad-accent); background: var(--ad-tint); }

@media (max-width: 800px) {
  .ad-layout { grid-template-columns: 1fr; }
  .ad-stage { height: 55vh; top: 0; z-index: 30; }
}
</style>
{{ end }}

{{ define "main" }}
<div class="ad-tool">
  <h1>{{ .Title }}</h1>

  <div class="ad-toolbar">
    <button class="ad-btn ad-btn-primary" type="button" onclick="adPresent()">Present full screen</button>
    <button class="ad-btn" type="button" onclick="adExport()">Save picture</button>
    <button class="ad-btn" type="button" onclick="adReset()">Start over</button>
  </div>

  <div class="ad-layout">
    <div class="ad-stage" id="ad-stage" title="Click to exit full screen">
      <div class="ad-fit" id="ad-fit">
        <div class="ad-character">
          <div id="ad-hair" class="ad-part"><span></span></div>
          <div id="ad-head" class="ad-part"><span></span></div>
          <div id="ad-eyes" class="ad-part"><span></span><span></span></div>
          <div id="ad-nose" class="ad-part"><span></span></div>
          <div id="ad-mouth" class="ad-part"><span></span></div>
          <div id="ad-body" class="ad-part"><span></span></div>
          <div id="ad-arm-left" class="ad-part"><span></span></div>
          <div id="ad-arm-right" class="ad-part"><span></span></div>
          <div id="ad-hand-left" class="ad-part"><span></span></div>
          <div id="ad-hand-right" class="ad-part"><span></span></div>
          <div id="ad-leg-left" class="ad-part"><span></span></div>
          <div id="ad-leg-right" class="ad-part"><span></span></div>
          <div id="ad-foot-left" class="ad-part"><span></span></div>
          <div id="ad-foot-right" class="ad-part"><span></span></div>
        </div>
      </div>
    </div>

    <div class="ad-controls" id="ad-controls"></div>
  </div>
</div>

<script>
(function () {
  const foods = {
    hair: ['🍝', '🥗', '🥦', '🍜', '🥬', '🍟', '🥓', '🧀'],
    head: ['🌕', '🧀', '🍈', '🥥', '🥯', '🥞', '🧇', '🍪', '🍕'],
    eyes: ['🫐', '🍇', '🫒', '🌰', '🍳', '🥝', '🍒', '🍭'],
    nose: ['🥕', '🥒', '🍌', '🌽', '🌶️', '🍆', '🌭', '🍤'],
    mouth: ['🌭', '🥓', '🍌', '🍉', '🥐', '🥖', '🌽', '👄'],
    body: ['🍞', '🥔', '🥩', '🥪', '🍔', '🥡', '🎂', '🍩', '🥧'],
    arms: ['🥖', '🥨', '🦴', '🌽', '🥕', '🥢', '🍭', '🥒'],
    hands: ['🥯', '🍪', '🧁', '🍊', '🍎', '🥝', '🥥', '🥔'],
    legs: ['🍕', '🥖', '🥕', '🌽', '🍌', '🍦', '🍡', '🍫'],
    feet: ['🍞', '🥔', '🥩', '🥪', '🧀', '🥐', '🥯', '🧇']
  };

  // Each part maps to the display spans it fills (paired parts fill left and right)
  const targets = {
    hair: '#ad-hair span', head: '#ad-head span', eyes: '#ad-eyes span',
    nose: '#ad-nose span', mouth: '#ad-mouth span', body: '#ad-body span',
    arms: '#ad-arm-left span, #ad-arm-right span',
    hands: '#ad-hand-left span, #ad-hand-right span',
    legs: '#ad-leg-left span, #ad-leg-right span',
    feet: '#ad-foot-left span, #ad-foot-right span'
  };

  function setPart(part, emoji) {
    document.querySelectorAll(targets[part]).forEach(el => el.textContent = emoji);
  }

  const controls = document.getElementById('ad-controls');
  Object.keys(foods).forEach(part => {
    const name = part.charAt(0).toUpperCase() + part.slice(1);
    const group = document.createElement('div');
    group.className = 'ad-group';
    group.innerHTML =
      '<div class="ad-group-head"><h2>' + name + '</h2>' +
      '<div class="ad-custom"><input type="text" placeholder="..." aria-label="Custom ' + part + ' emoji">' +
      '<button class="ad-btn" type="button">Set</button></div></div>' +
      '<div class="ad-grid"></div>';

    const grid = group.querySelector('.ad-grid');
    const input = group.querySelector('input');
    const clearPressed = () => grid.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', 'false'));

    const applyCustom = () => { if (input.value) { setPart(part, input.value); clearPressed(); } };
    group.querySelector('.ad-custom button').onclick = applyCustom;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') applyCustom(); });

    foods[part].forEach(emoji => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ad-emoji';
      btn.textContent = emoji;
      btn.setAttribute('aria-pressed', 'false');
      btn.onclick = () => { clearPressed(); btn.setAttribute('aria-pressed', 'true'); setPart(part, emoji); input.value = ''; };
      grid.appendChild(btn);
    });
    controls.appendChild(group);
  });

  // Scale the fixed-size character to fill the stage, in the page and in full screen
  const stage = document.getElementById('ad-stage');
  const fit = document.getElementById('ad-fit');
  new ResizeObserver(() => {
    const s = Math.min(stage.clientWidth / fit.offsetWidth, stage.clientHeight / fit.offsetHeight) * 0.95;
    fit.style.transform = 'scale(' + s + ')';
  }).observe(stage);

  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  window.adPresent = () => (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage);
  stage.addEventListener('click', () => {
    if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  });

  window.adReset = () => {
    Object.keys(targets).forEach(part => setPart(part, ''));
    controls.querySelectorAll('.ad-emoji').forEach(b => b.setAttribute('aria-pressed', 'false'));
    controls.querySelectorAll('input').forEach(i => i.value = '');
  };

  window.adExport = () => {
    html2canvas(stage, { backgroundColor: '#ffffff' }).then(canvas => {
      const link = document.createElement('a');
      link.download = 'aiken-drum.png';
      link.href = canvas.toDataURL();
      link.click();
    });
  };
})();
</script>
